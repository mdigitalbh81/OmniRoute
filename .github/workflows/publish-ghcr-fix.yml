name: Publish OmniRoute 3.8.48 Fix to GHCR

on:
  push:
    branches:
      - fix/antigravity-429-fast-fallback

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/mdigitalbh81/omniroute
  IMAGE_TAG: 3.8.48-fix-429

jobs:
  build:
    name: Build ARM64 image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Extract commit SHA
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push OmniRoute
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runner-base
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:sha-${{ steps.vars.outputs.sha_short }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
            org.opencontainers.image.ref.name=${{ github.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
