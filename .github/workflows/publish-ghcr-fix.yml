name: Publish OmniRoute 3.8.48 Fix to GHCR

on:
  push:
    branches:
      - fix/antigravity-429-fast-fallback
    paths:
      - "src/shared/utils/classify429.ts"
      - "open-sse/translator/response/gemini-to-openai.ts"
      - "Dockerfile"
      - ".github/workflows/publish-ghcr-fix.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/mdigitalbh81/omniroute
  IMAGE_TAG: 3.8.48-fix-429-usage

jobs:
  build:
    name: Build ARM64 image
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push OmniRoute
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runner-base
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
