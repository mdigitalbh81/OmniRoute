name: Build Multi-VSCode ARM64

on:
  push:
    branches:
      - "fix/multivscode-upstream-current-20260927"
  workflow_dispatch:

concurrency:
  group: multivscode-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mdigitalbh81/omniroute
  TAG: 3.8.51-multivscode-current-arm64

jobs:
  validate:
    name: Validate concurrency recovery branch
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Focused regression tests
        env:
          DISABLE_SQLITE_AUTO_BACKUP: "true"
        run: |
          node --max-old-space-size=8192 \
            --import tsx/esm \
            --import ./open-sse/utils/setupPolyfill.ts \
            --import ./tests/_setup/isolateDataDir.ts \
            --test \
            --test-force-exit \
            --test-concurrency=1 \
            tests/unit/multivscode-hotpath-regression.test.ts

      - name: Core typecheck
        run: npm run typecheck:core

      - name: Open-SSE typecheck
        run: npm run typecheck:open-sse

  build-arm64:
    name: Build and smoke-test native ARM64
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Assert native ARM64 runner
        run: test "$(uname -m)" = "aarch64"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-base
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:multivscode-${{ github.sha }}-arm64
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=12288
          cache-from: type=gha,scope=multivscode-arm64
          cache-to: type=gha,scope=multivscode-arm64,mode=max,ignore-error=true
          provenance: true

      - name: Verify image
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
          docker pull "${IMAGE}:${TAG}"
          docker image inspect "${IMAGE}:${TAG}" --format 'Arch={{.Architecture}} OS={{.Os}}'

      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name omniroute-smoke \
            -p 20128:20128 \
            -e INITIAL_PASSWORD=CI_SMOKE_ONLY \
            -e OMNIROUTE_CHAT_MAX_HEAVY_IN_FLIGHT=5 \
            -e OMNIROUTE_CHAT_ADMISSION_HEALTHY_HEADROOM=0 \
            -e OMNIROUTE_MEMORY_MB=3072 \
            "${IMAGE}:${TAG}"

          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:20128/api/monitoring/health >/tmp/health.json; then
              cat /tmp/health.json
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            docker logs --tail 300 omniroute-smoke || true
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: docker rm -f omniroute-smoke >/dev/null 2>&1 || true
