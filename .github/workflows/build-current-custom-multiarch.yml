name: Build current custom OmniRoute multiarch

on:
  push:
    branches:
      - "deploy/v3.8.51-current-custom-20260929"
  workflow_dispatch:

concurrency:
  group: current-custom-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mdigitalbh81/omniroute

jobs:
  focused-tests:
    name: Focused regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node 26
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Run focused regressions
        env:
          DISABLE_SQLITE_AUTO_BACKUP: "true"
        run: |
          node --max-old-space-size=8192 \
            --import tsx/esm \
            --import ./open-sse/utils/setupPolyfill.ts \
            --import ./tests/_setup/isolateDataDir.ts \
            --test \
            --test-force-exit \
            --test-concurrency=1 \
            tests/unit/antigravity-client-profile.test.ts \
            tests/unit/antigravity-streaming-passthrough.test.ts \
            tests/unit/executor-antigravity.test.ts \
            tests/unit/provider-execution-pipeline.test.ts \
            tests/unit/antigravity-duplicate-tool-id-regression.test.ts \
            tests/unit/responses-web-search-choice-regression.test.ts \
            tests/unit/native-codex-auto-resume.test.ts \
            tests/unit/native-codex-turn-pin-model-scoped-fallback.test.ts \
            tests/unit/chat-admission-abandoned-stream-lease.test.ts \
            tests/unit/chat-admission-pending-handler-abort-14456.test.ts \
            tests/unit/resource-pressure-gate-recovery.test.ts

      - name: Core typecheck
        run: npm run typecheck:core

  build-amd64:
    name: Build and push AMD64
    needs: focused-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push AMD64
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-base
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:3.8.51-current-custom-amd64
            ${{ env.IMAGE }}:current-custom-${{ github.sha }}-amd64
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.base.name=release/v3.8.51
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=8192
          cache-from: type=gha,scope=current-custom-amd64
          cache-to: type=gha,scope=current-custom-amd64,mode=max,ignore-error=true
          provenance: true

  build-arm64:
    name: Build and push ARM64
    needs: focused-tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Assert native ARM64 runner
        run: test "$(uname -m)" = "aarch64"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-base
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:3.8.51-current-custom-arm64
            ${{ env.IMAGE }}:current-custom-${{ github.sha }}-arm64
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.base.name=release/v3.8.51
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=12288
          cache-from: type=gha,scope=current-custom-arm64
          cache-to: type=gha,scope=current-custom-arm64,mode=max,ignore-error=true
          provenance: true

  manifest:
    name: Publish multiarch manifest
    needs:
      - build-amd64
      - build-arm64
    runs-on: ubuntu-24.04
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multiarch tags
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:3.8.51-current-custom" \
            -t "${IMAGE}:current-custom-${GITHUB_SHA}" \
            "${IMAGE}:current-custom-${GITHUB_SHA}-amd64" \
            "${IMAGE}:current-custom-${GITHUB_SHA}-arm64"

      - name: Verify manifest
        run: |
          docker buildx imagetools inspect "${IMAGE}:3.8.51-current-custom"
          docker buildx imagetools inspect "${IMAGE}:current-custom-${GITHUB_SHA}"
