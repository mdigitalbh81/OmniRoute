name: Assemble native-stable OOM + auto-resume ARM64

on:
  push:
    branches:
      - "deploy/native-stable-oom-autoresume-20260929"

concurrency:
  group: native-stable-oom-autoresume
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  assemble:
    if: github.event.head_commit.message == 'ci: assemble native stable fixes'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.final.outputs.sha }}
    steps:
      - name: Checkout native-stable branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch exact fix commits
        run: |
          git fetch origin 0396653d7338437afe332b910d4e78c4cb907dbe
          git fetch origin dfd47b21d3c60d47476e0cbfbf42728306419f05
          git fetch origin 72d801eef418f92d9a35bfd352dac1e0e4c5d95b
          git fetch origin 09b9da349656ae278d9d2bb8215b8784bdf2ae92
          git fetch origin e7d5e9949fc008855bd8b6dff99a49014ec40446
          git fetch origin d80b9467d3d8d5394f11e1c3c3ddf9303520fb93

      - name: Cherry-pick only the proven fixes
        run: |
          git cherry-pick 0396653d7338437afe332b910d4e78c4cb907dbe
          git cherry-pick dfd47b21d3c60d47476e0cbfbf42728306419f05
          git cherry-pick 72d801eef418f92d9a35bfd352dac1e0e4c5d95b
          git cherry-pick 09b9da349656ae278d9d2bb8215b8784bdf2ae92
          git cherry-pick e7d5e9949fc008855bd8b6dff99a49014ec40446
          git cherry-pick d80b9467d3d8d5394f11e1c3c3ddf9303520fb93

      - name: Push assembled branch
        run: git push origin HEAD:deploy/native-stable-oom-autoresume-20260929

      - id: final
        name: Record assembled SHA
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout assembled SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.assemble.outputs.sha }}
          persist-credentials: false

      - name: Set up Node 26
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Focused regression tests
        env:
          DISABLE_SQLITE_AUTO_BACKUP: "true"
        run: |
          FILES=""
          for f in \
            tests/unit/native-codex-auto-resume.test.ts \
            tests/unit/antigravity-streaming-passthrough.test.ts \
            tests/unit/chat-admission-abandoned-stream-lease.test.ts \
            tests/unit/chat-admission-pending-handler-abort-14456.test.ts \
            tests/unit/resource-pressure-gate-recovery.test.ts
          do
            if [ -f "$f" ]; then FILES="$FILES $f"; fi
          done
          test -n "$FILES"
          node --max-old-space-size=8192 \
            --import tsx/esm \
            --import ./open-sse/utils/setupPolyfill.ts \
            --import ./tests/_setup/isolateDataDir.ts \
            --test \
            --test-force-exit \
            --test-concurrency=1 \
            $FILES

      - name: Core typecheck
        run: npm run typecheck:core

  build-arm64:
    needs:
      - assemble
      - verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      IMAGE: ghcr.io/mdigitalbh81/omniroute
      SHA: ${{ needs.assemble.outputs.sha }}
    steps:
      - name: Checkout assembled SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.assemble.outputs.sha }}
          persist-credentials: false

      - name: Assert native ARM64 runner
        run: test "$(uname -m)" = "aarch64"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-base
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:3.8.51-native-codex-oomfix-arm64
            ${{ env.IMAGE }}:native-codex-oomfix-${{ env.SHA }}-arm64
          labels: |
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.base.revision=bfe6fcf4b6399b989942d936627d8e4b624f87d7
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=12288
          cache-from: type=gha,scope=native-stable-oomfix-arm64
          cache-to: type=gha,scope=native-stable-oomfix-arm64,mode=max,ignore-error=true
          provenance: true

      - name: Verify pushed image
        run: docker buildx imagetools inspect "${IMAGE}:native-codex-oomfix-${SHA}-arm64"
